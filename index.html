*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#e0edff 0%,#f0f6ff 50%,#e8f1ff 100%);min-height:100vh;direction:rtl}

.hero{background:linear-gradient(135deg,#2563eb,#3b82f6,#60a5fa);padding:32px 24px 28px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30px;left:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::after{content:'';position:absolute;bottom:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-icon{font-size:48px;margin-bottom:10px;display:block}
.hero h1{color:#fff;font-size:26px;font-weight:700;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero p{color:rgba(255,255,255,.88);font-size:14px;margin-bottom:16px}
.audio-test-btn{background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.5);padding:8px 22px;border-radius:50px;font-size:14px;cursor:pointer;backdrop-filter:blur(4px);transition:all .2s;font-family:inherit}
.audio-test-btn:hover{background:rgba(255,255,255,.35)}

.controls{padding:16px 20px;background:#fff;border-bottom:1px solid #dfeafc;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(37,99,235,.08)}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{width:100%;padding:10px 44px 10px 16px;border:1.5px solid #bfd7fb;border-radius:50px;font-size:14px;outline:none;background:#f7faff;color:#1a2a4a;transition:border .2s;font-family:inherit;direction:rtl}
.search-wrap input:focus{border-color:#2563eb;background:#fff}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#2563eb}
.count{text-align:center;font-size:12px;color:#5b82c4;margin-bottom:10px}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ftag{padding:6px 16px;border-radius:50px;border:1.5px solid #bfd7fb;background:#f0f6ff;color:#2a4f9e;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;white-space:nowrap;font-family:inherit}
.ftag:hover{border-color:#2563eb;background:#e0edff}
.ftag.active{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(37,99,235,.3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:20px}

.card{background:#fff;border-radius:18px;border:1.5px solid #d3e3fb;padding:18px 14px 14px;text-align:center;cursor:pointer;transition:all .22s;position:relative;box-shadow:0 2px 8px rgba(37,99,235,.06)}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(37,99,235,.18);border-color:#3b82f6}
.card.playing{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.2),0 8px 24px rgba(37,99,235,.18)}

.card-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,#e0edff,#bfd7fb)}
.card-word{font-size:17px;font-weight:700;color:#1a2a4a;margin-bottom:4px;line-height:1.4}
.card-en{display:inline-block;padding:3px 12px;border-radius:50px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(135deg,#2563eb,#3b82f6);margin-bottom:8px}
.card-ex{font-size:12px;color:#4a5f8a;line-height:1.6;min-height:36px}
.audio-btn{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#3b82f6);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:8px auto 0;transition:all .2s;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.audio-btn:hover{transform:scale(1.1);box-shadow:0 4px 14px rgba(37,99,235,.45)}
.audio-btn svg{width:14px;height:14px;fill:#fff}
.audio-btn.playing-anim{animation:pulse-ring .6s ease-in-out infinite}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}50%{box-shadow:0 0 0 8px rgba(37,99,235,0)}}

.cat-badge{position:absolute;top:8px;left:8px;width:10px;height:10px;border-radius:50%}
.cat-lesson{background:#2563eb}
.cat-adj{background:#f59e0b}
.cat-verb{background:#6366f1}

.section-divider span{font-size:13px;font-weight:700;color:#2563eb;white-space:nowrap}

.no-results{grid-column:1/-1;text-align:center;padding:40px;color:#5b82c4;font-size:16px}

.legend{padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;border-bottom:1px solid #dfeafc;background:#fff}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#4a5f8a}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

footer{text-align:center;padding:20px;font-size:12px;color:#5b82c4}

.phrase-section .card-en{background:linear-gradient(135deg,#f59e0b,#fb923c)}

const CATS = {
  all:   {label:'🔮 الكل', cls:''},
  lesson:{label:'📱 الأسماء', cls:''},

let currentCat = 'all';
let synth = window.speechSynthesis;
let currentPlaying = null;
let currentUtt = null;          // keep a reference so the browser does not garbage-collect it mid-speech
let noVoiceWarned = false;

// Names of common Arabic voices (male / female) across Edge, Windows, macOS/iOS, Android
const MALE_HINTS   = ['hamdan','hamed','shakir','naayf','maged','majed','tarik','tariq','omar','salem','fahed','jamal','khalid','youssef','yousef','male','ذكر'];
const FEMALE_HINTS = ['fatima','zariyah','hoda','salma','laila','layla','mariam','maryam','amal','noor','sara','female','أنثى'];

function arabicVoices(){
  if(!synth) return [];
  return synth.getVoices().filter(v=>/^ar([-_]|$)/i.test(v.lang) || /arab|عرب/i.test(v.name));
}

function voiceScore(v){
  const n = v.name.toLowerCase();
  let s = 0;
  if(/female/.test(n) || FEMALE_HINTS.some(h=>n.includes(h))) s -= 10;
  else if(MALE_HINTS.some(h=>n.includes(h))) s += 10;
  if(/^ar[-_]ae/i.test(v.lang)) s += 3;       // Emirati Arabic first
  else if(/^ar[-_]sa/i.test(v.lang)) s += 2;
  else if(/^ar[-_]eg/i.test(v.lang)) s += 1;
  if(/natural|online/.test(n)) s += 2;         // neural voices sound clearer
  return s;
}

function pickVoice(){
  const list = arabicVoices();
  if(!list.length) return null;
  return list.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
}

function testAudio(){
  speak('مرحباً، هذا اختبار للصوت. قاموس درس أحب هاتفي.');
}

function resetPlaying(){
  if(currentPlaying){
    currentPlaying.classList.remove('playing','playing-anim');
    const btn = currentPlaying.querySelector('.audio-btn');
    if(btn) btn.classList.remove('playing-anim');
    currentPlaying = null;
  }
}

function speak(text, cardEl){
  if(!synth || typeof SpeechSynthesisUtterance === 'undefined'){
    alert('هذا المتصفح لا يدعم النطق الصوتي. جرّب Microsoft Edge أو Google Chrome.');
    return;
  }
  synth.cancel();
  resetPlaying();

  const voice = pickVoice();
  if(!voice && !noVoiceWarned && synth.getVoices().length){
    noVoiceWarned = true;
    alert('لا يوجد صوت عربي على هذا الجهاز.\nجرّب متصفح Microsoft Edge، أو أضف حزمة الصوت العربي من إعدادات الجهاز.');
  }

  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = voice ? voice.lang : 'ar-SA';
  utt.rate = 0.82;
  utt.pitch = (voice && voiceScore(voice) >= 10) ? 1.05 : 1;   // male voice, slightly bright = young man
  if(voice) utt.voice = voice;
  currentUtt = utt;

  const btn = cardEl ? cardEl.querySelector('.audio-btn') : null;
  const done = ()=>{
    if(cardEl) cardEl.classList.remove('playing');
    if(btn) btn.classList.remove('playing-anim');
    if(currentPlaying === cardEl) currentPlaying = null;
  };
  if(cardEl){
    currentPlaying = cardEl;
    cardEl.classList.add('playing');
    if(btn) btn.classList.add('playing-anim');
    utt.onend = done;
  }
  utt.onerror = done;

  // speaking right after cancel() is silently dropped by Chrome/Edge, so wait a moment
  setTimeout(()=>{ synth.resume(); synth.speak(utt); }, 80);
}

function playWord(id){
  const w = WORDS.find(x=>x.id===id);
  if(!w) return;
  const card = document.getElementById('card-'+id);
  speak(w.ar + '. ' + w.ex, card);
}

function buildFilters(){
  const row = document.getElementById('filterRow');
  row.innerHTML = Object.entries(CATS).map(([k,v])=>
    `<button class="ftag${k===currentCat?' active':''}" onclick="setFilter('${k}')">${v.label}</button>`
  ).join('');
}

function setFilter(cat){
  currentCat = cat;
  buildFilters();
  renderCards();
}

function filterCards(){
  renderCards();
}

function renderCards(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('cardsGrid');
  const filtered = WORDS.filter(w=>{
    const matchCat = currentCat==='all' || w.cat===currentCat;
    const matchQ = !q || w.ar.includes(q) || w.en.toLowerCase().includes(q) || w.ex.includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('countLabel').textContent = filtered.length + ' كلمة';

  if(!filtered.length){
    grid.innerHTML = '<div class="no-results">🔍 لا توجد نتائج للبحث</div>';
    return;
  }

  // Group by category for section dividers
  const groups = {};
  filtered.forEach(w=>{
    if(!groups[w.cat]) groups[w.cat]=[];
    groups[w.cat].push(w);
  });

  const catOrder = ['lesson','adj','verb','opinion','time','compare'];
  const catNames = {
    lesson:'📱 الأسماء — كلمات الدرس',
    adj:'🍊 الصفات — أَصِفُ هَاتِفِي',
    verb:'💜 الأفعال',
    opinion:'🩷 عبارات الرأي',
    time:'🔵 ظروف الزمان',
    compare:'⚖️ ألفاظ المقارنة'
  };

  let html = '';
  (currentCat==='all' ? catOrder : [currentCat]).forEach(cat=>{
    const ws = groups[cat];
    if(!ws || !ws.length) return;
    const cls = CATS[cat]?.cls || '';
    if(currentCat==='all'){
      html += `<div class="section-divider"><span>${catNames[cat]||cat}</span></div>`;
    }
    ws.forEach(w=>{
      html += `<div class="card ${cls}" id="card-${w.id}" onclick="playWord(${w.id})">
        <div class="cat-badge cat-${w.cat}"></div>
        <div class="card-icon">${w.icon}</div>
        <div class="card-word">${w.ar}</div>
        <span class="card-en">${w.en}</span>
        <div class="card-ex">${w.ex}</div>
        <button class="audio-btn" onclick="event.stopPropagation();playWord(${w.id})" aria-label="استمع">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
      </div>`;
    });
  });

  grid.innerHTML = html;
}

// Init voices
if(window.speechSynthesis){
  synth.getVoices();
  if(synth.onvoiceschanged !== undefined){
    synth.onvoiceschanged = ()=>{ synth.getVoices(); };
  }
}

buildFilters();
renderCards();
</script>
</body>
</html>
